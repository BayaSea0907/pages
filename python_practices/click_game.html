<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>クリックゲーム</title>
        <style>
            body {
                font-family: sans-serif;
                text-align: center;
            }
            /* スマートフォン（canvas幅600px未満）では画面中央に縦揃えする */
            @media (max-width: 600px) {
                body {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    margin: 0;
                    padding: 16px 0;
                    box-sizing: border-box;
                    gap: 16px;
                }
                /* メニューの説明文をスマホ向けに小さくして改行を減らす */
                .menu p {
                    font-size: 0.85em;
                }
                /* ランク一覧をスマホ向けに縮小して表示崩れを防ぐ */
                .result__rank-table {
                    font-size: 0.8em;
                    width: max-content;
                }
                .result__rank-table td {
                    padding: 4px 4px;
                }
            }
            canvas {
                display: block;
                /* 画面幅より広い場合は縮小し、縦横比を保って高さも追従させる */
                max-width: 100%;
                height: auto;
            }
            /* メニュー・結果は常に中央揃え。デスクトップではキャンバスと同じ高さに固定して
               スタートボタンの位置をゲーム画面の中央付近に揃える。 */
            .menu,
            .result {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            @media (min-width: 601px) {
                .menu,
                .result {
                    min-height: 400px;
                    justify-content: center;
                }
            }
            /* ゲームプレイ中はcanvasを画面中央に配置する */
            .playing {
                min-height: 100dvh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            /* canvas とリンクをまとめる縦並びコンテナ */
            .playing__wrapper {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                max-width: 100%;
            }
            /* 「タイトルに戻る」リンク */
            .playing__back-link {
                display: block;
                text-align: right;
                padding: 0 0 4px;
                font-size: 0.78em;
                color: #aaa;
                text-decoration: none;
            }
            .playing__back-link:hover { color: #777; }
            /* メニューの各設定行 */
            .menu__option {
                margin: 16px 0;
            }
            .menu__label {
                display: block;
                margin-bottom: 8px;
                font-weight: bold;
            }
            /* 選択ボタンのグループ */
            .menu__btn-group {
                display: flex;
                justify-content: center;
                gap: 8px;
                flex-wrap: wrap; /* 画面が狭いとき折り返す */
            }
            /* スタート・リトライボタン */
            .menu__start,
            .result__retry {
                padding: 12px 28px;
                font-size: 1.1em;
                cursor: pointer;
                margin-top: 16px;
            }
            /* 選択ボタン（基本） */
            .opt-btn {
                padding: 8px 16px;
                font-size: 1em;
                cursor: pointer;
                border: 2px solid #ccc;
                background: white;
                border-radius: 6px;
                line-height: 1.4;
            }
            /* ボタン内の補足テキスト（mm・px 表記） */
            .opt-btn__sub {
                display: block;
                font-size: 0.75em;
                opacity: 0.8;
            }
            /* 選択中のボタン（modifier） */
            .opt-btn--active {
                background: #E74C3C;
                color: white;
                border-color: #C0392B;
            }
            /* "あなたの反射神経レベルは..." */
            .result__subtitle {
                font-size: 1.1em;
                font-weight: bold;
                color: #555;
                margin: 4px 0 12px;
            }
            /* ランク文字 */
            .result__rank {
                font-size: 3.2em;
                font-weight: bold;
                margin: 8px 0;
            }
            /* description（最小） */
            .result__desc {
                font-size: 0.9em;
                color: #666;
                margin: 4px 0;
            }
            /* クリック数・スコア表示 */
            .result__clicks,
            .result__score { font-weight: bold; font-size: 14px; }
            /* ランク一覧テーブル */
            .result__rank-table {
                margin: 8px auto 16px;
                border-collapse: collapse;
            }
            .result__rank-table td {
                padding: 6px 20px;
            }
            /* 現在のランク行を強調 */
            .result__rank-table tr.is-current td {
                font-weight: bold;
                color: #E74C3C;
            }
        </style>
    </head>
    <body>
        <h1>🎯クリックゲーム</h1>

        <!-- state: menu -->
        <div class="menu">
            <p>
                画面に次々と現れるボールをクリックしよう！<br>
                制限時間は <strong>10秒</strong>、登場するボールは最大 <strong>30個</strong>。<br>
                全部クリックできれば天才だ！反射神経が試されるぞ！
            </p>

            <div class="menu__option">
                <label class="menu__label">ボールのサイズ</label>
                <div class="menu__btn-group">
                    <button class="opt-btn opt-btn--radius opt-btn--active" data-value="42.5">Lv1<small class="opt-btn__sub">85px</small></button>
                    <button class="opt-btn opt-btn--radius" data-value="37.5">Lv2<small class="opt-btn__sub">75px</small></button>
                    <button class="opt-btn opt-btn--radius" data-value="25">Lv3<small class="opt-btn__sub">50px</small></button>
                    <button class="opt-btn opt-btn--radius" data-value="12.5">Lv4<small class="opt-btn__sub">25px</small></button>
                    <button class="opt-btn opt-btn--radius" data-value="7.5">Lv5<small class="opt-btn__sub">15px</small></button>
                </div>
            </div>

            <div class="menu__option">
                <label class="menu__label">同時に出現するボールの数</label>
                <div class="menu__btn-group">
                    <button class="opt-btn opt-btn--count opt-btn--active" data-value="1">1</button>
                    <button class="opt-btn opt-btn--count" data-value="2">2</button>
                    <button class="opt-btn opt-btn--count" data-value="3">3</button>
                    <button class="opt-btn opt-btn--count" data-value="4">4</button>
                    <button class="opt-btn opt-btn--count" data-value="5">5</button>
                </div>
            </div>

            <div class="menu__option">
                <label class="menu__label">ボールの動き</label>
                <div class="menu__btn-group">
                    <button class="opt-btn opt-btn--move opt-btn--active" data-value="0">停止モード</button>
                    <button class="opt-btn opt-btn--move" data-value="1">移動モード</button>
                </div>
            </div>

            <button class="menu__start">スタート</button>
        </div>

        <!-- state: playing -->
        <div class="playing" style="display:none;">
            <div class="playing__wrapper">
                <a href="#" class="playing__back-link">タイトルに戻る</a>
                <canvas class="playing__canvas" width="600" height="400"></canvas>
            </div>
        </div>

        <!-- state: result -->
        <div class="result" style="display:none;">
            <p class="result__clicks"></p>
            <p class="result__score"></p>
            <p class="result__subtitle">あなたの反射神経レベルは...</p>
            <p class="result__rank"></p>
            <p class="result__desc"></p>
            <table class="result__rank-table"></table>
            <button class="result__retry">もう一度</button>
        </div>

        <script>
            // ==============================
            // 設定変数
            // ここの値を変えるだけでゲームの挙動を調整できる。
            // Python でいう定数辞書 CONFIG = {...} と同じ感覚。
            // ==============================
            const CONFIG = {
                GAME_DURATION:  10,    // ゲーム時間（秒）
                MAX_TOTAL:      30,    // 1ゲームで登場するボールの最大数
                CIRCLE_COUNT:   1,     // 同時に表示する円の数（1〜5）
                CIRCLE_RADIUS:  42.5,  // 円の半径（px）← 直径85px（Lv1）がデフォルト
                CANVAS_WIDTH:  600,    // canvas の横幅（上の width 属性と合わせる）
                CANVAS_HEIGHT: 400,    // canvas の縦幅（上の height 属性と合わせる）
                BALL_MOVES:    false,  // true: ボールが動く、false: 静止
            };

            // 円サイズ（半径）から難易度情報へのマッピング。
            // multiplier はスコアに掛ける係数で、難しいLvほど大きい。
            const LV_TABLE = {
                42.5: { lv: 1, multiplier: 1.0 },
                37.5: { lv: 2, multiplier: 1.2 },
                25:   { lv: 3, multiplier: 1.5 },
                12.5: { lv: 4, multiplier: 2.0 },
                7.5:  { lv: 5, multiplier: 3.0 },
            };

            // スコア（クリック数×倍率）に応じたランク定義。
            // min が高い順に並べ、最初にマッチしたランクを採用する。
            const RANK_TABLE = [
                { rank: "SS", threshold: "27~30", min: 27, label: "プロゲーマーレベル", description: "猫と張り合えそう..."                   },
                { rank: "S",  threshold: "21~26", min: 21, label: "ゲームランカー勢",   description: "ジャンケン絶対に勝てそう..."              },
                { rank: "A",  threshold: "15~20", min: 15, label: "ゲーム上手い勢",     description: "蚊を仕留めるのはお手のもの..."        },
                { rank: "B",  threshold: "9~14",  min: 9,  label: "ゲームカジュアル勢", description: "可もなく不可もなく普通です..."         },
                { rank: "C",  threshold: "0~8",   min: 0,  label: "ドパガキ",           description: "運転免許を持ってたら返納してください..."   },
            ];

            // ==============================
            // DOM 参照
            // ==============================
            const canvas = document.querySelector(".playing__canvas");
            // getContext("2d") で「2D描画用の道具箱（ctx）」を取得する。
            // この ctx を通じて図形・色・テキストを canvas に描く。
            // 3d, webglなどがある。
            const ctx = canvas.getContext("2d");

            // ==============================
            // 表示/非表示状態切り替え
            // ==============================
            function switchState(from, to) {
                document.querySelector("." + from).style.display = "none";
                document.querySelector("." + to).style.display = "block";
            }

            // ==============================
            // 円の生成
            // ==============================
            // HUD（スコア・タイマー表示）が占める上部の高さ。
            // この範囲内に円の中心が来ないようにして視認性を確保する。
            const HUD_HEIGHT = 50;

            // ボールの移動速度（px/フレーム）。
            const BALL_SPEED = 3;

            function createCircle() {
                const r     = CONFIG.CIRCLE_RADIUS;
                const angle = Math.random() * Math.PI * 2;
                return {
                    cx: r + Math.random() * (CONFIG.CANVAS_WIDTH  - r * 2),
                    // HUD_HEIGHT + r を下限にすることで HUD 領域に被らない位置に出現させる。
                    cy: HUD_HEIGHT + r + Math.random() * (CONFIG.CANVAS_HEIGHT - HUD_HEIGHT - r * 2),
                    radius: r,
                    vx: Math.cos(angle) * BALL_SPEED,
                    vy: Math.sin(angle) * BALL_SPEED,
                };
            }

            function moveCircles() {
                const r = CONFIG.CIRCLE_RADIUS;
                for (const c of circles) {
                    c.cx += c.vx;
                    c.cy += c.vy;
                    // 左右の壁で反射。
                    if (c.cx - r < 0)                    { c.cx = r;                       c.vx *= -1; }
                    if (c.cx + r > CONFIG.CANVAS_WIDTH)  { c.cx = CONFIG.CANVAS_WIDTH - r; c.vx *= -1; }
                    // 上下の壁で反射（上端は HUD 領域の下まで）。
                    if (c.cy - r < HUD_HEIGHT)           { c.cy = HUD_HEIGHT + r;          c.vy *= -1; }
                    if (c.cy + r > CONFIG.CANVAS_HEIGHT) { c.cy = CONFIG.CANVAS_HEIGHT - r; c.vy *= -1; }
                }
            }

            // 画面上に表示中の円を入れておく配列。
            let circles = [];

            // クリック成功数（スコア）。
            let score = 0;

            // ゲーム開始からこれまでに登場したボールの累計数。
            // MAX_TOTAL に達したら新しいボールを出さない。
            let totalSpawned = 0;

            // タイマー管理。
            let timeLeft   = CONFIG.GAME_DURATION; // 残り秒数（draw() で参照する）
            let startTime  = null;                  // ゲーム開始時の timestamp
            let gameLoopId = null;                  // requestAnimationFrame の戻り値（キャンセルに使う）

            function getLvInfo() {
                return LV_TABLE[CONFIG.CIRCLE_RADIUS] ?? { lv: 1, multiplier: 1.0 };
            }

            function getRankEntry() {
                const adjScore = Math.round(score * getLvInfo().multiplier);
                return RANK_TABLE.find(r => adjScore >= r.min) ?? RANK_TABLE[RANK_TABLE.length - 1];
            }

            // ==============================
            // 描画
            // 状態が変わるたびに呼び出して「上書き再描画」する。
            // ==============================
            function draw() {
                // まず背景色で canvas 全体を塗りつぶして前のフレームを消す。
                ctx.fillStyle = "#1a1a2e";
                ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

                // 円を1つずつ描画する。
                // 影と色はすべての円で共通なのでループの前に1回だけ設定する。
                // shadowColor/shadowBlur を設定すると fill() に影が落ちる。
                ctx.shadowColor   = "rgba(0, 0, 0, 0.55)";
                ctx.shadowBlur    = 10;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 3;
                ctx.fillStyle     = "#E74C3C";
                for (const c of circles) {
                    ctx.beginPath();
                    ctx.arc(c.cx, c.cy, c.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                // HUD の描画に影が残らないようリセット。
                ctx.shadowColor   = "transparent";
                ctx.shadowBlur    = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                // スコアと現在ランクを左上に表示する。
                ctx.fillStyle = "white";
                ctx.font      = "bold 14px sans-serif";
                ctx.textAlign = "left";
                ctx.fillText(score + " / " + CONFIG.MAX_TOTAL + "   現在のランク: " + getRankEntry().rank, 12, 27);

                // タイマーを canvas の右上に表示する。
                // toFixed(1) で小数点1桁に丸める（例: 7.3）。
                // 残り時間に応じて色を変える（5秒以下でオレンジ、2秒以下で赤）。
                ctx.fillStyle = timeLeft <= 2 ? "#FF4444" : timeLeft <= 5 ? "#FFA500" : "white";
                ctx.font      = "bold 28px monospace";
                ctx.textAlign = "right"; // テキストの基準点を右端に設定
                ctx.fillText(Math.max(0, timeLeft).toFixed(1) + "秒", CONFIG.CANVAS_WIDTH - 16, 36);
            }

            // ==============================
            // ゲームループ
            // requestAnimationFrame でブラウザの描画タイミング（約60fps）に合わせて
            // 毎フレーム呼び出される。ゲームが動いている間ずっと回り続ける。
            // ==============================
            function gameLoop() {
                // performance.now() はページ読み込みからの経過ミリ秒を返す。
                // /1000 で秒に変換し、ゲーム開始時刻との差を残り時間から引く。
                const elapsed = (performance.now() - startTime) / 1000;
                timeLeft = CONFIG.GAME_DURATION - elapsed;

                // 時間切れならゲーム終了へ。
                if (timeLeft <= 0) {
                    endGame();
                    return; // ここで関数を抜けてループを止める
                }

                if (CONFIG.BALL_MOVES) moveCircles();
                draw();

                // 次のフレームで再び gameLoop を呼ぶよう予約する。
                // 戻り値を gameLoopId に保存しておくと、後でキャンセルできる。
                gameLoopId = requestAnimationFrame(gameLoop);
            }

            // ==============================
            // ゲーム開始
            // ==============================
            function startGame() {
                circles      = []; // 前回の円をリセット
                score        = 0;  // スコアをリセット
                totalSpawned = 0;  // 登場数をリセット
                startTime    = performance.now(); // 開始時刻を記録

                for (let i = 0; i < CONFIG.CIRCLE_COUNT; i++) {
                    circles.push(createCircle());
                    totalSpawned++;
                }

                document.querySelector("h1").style.display = "none";
                switchState("menu", "playing");
                // switchState が block を上書きするため flex に再設定してキャンバスを中央に保つ。
                document.querySelector(".playing").style.display = "flex";
                // draw() を直接呼ぶ代わりに gameLoop を起動する。
                // 以降は gameLoop が毎フレーム draw() を呼び続ける。
                gameLoopId = requestAnimationFrame(gameLoop);
            }

            // ==============================
            // ゲーム終了
            // ==============================
            function endGame() {
                // ループを止める。cancelAnimationFrame に gameLoopId を渡すと
                // 予約済みの次フレーム呼び出しをキャンセルできる。
                cancelAnimationFrame(gameLoopId);
                gameLoopId = null; // ESC 判定の誤作動を防ぐためリセット

                const lvInfo    = getLvInfo();
                const adjScore  = Math.round(score * lvInfo.multiplier);
                const rankEntry = getRankEntry();

                // ランク文字を表示（SSランクのみ金色、それ以外は赤）。
                const rankEl = document.querySelector(".result__rank");
                rankEl.textContent = rankEntry.rank;
                rankEl.style.color = rankEntry.rank === "SS" ? "#FFD700" : "#E74C3C";

                document.querySelector(".result__desc").textContent = rankEntry.description;
                document.querySelector(".result__clicks").textContent =
                    score + " / " + CONFIG.MAX_TOTAL + " 個クリック（Lv" + lvInfo.lv + "）";
                document.querySelector(".result__score").textContent =
                    "スコア: " + adjScore + " 点（倍率: ×" + lvInfo.multiplier.toFixed(1) + "）";

                // ランク一覧を動的に生成し、自分のランクを強調表示する。
                document.querySelector(".result__rank-table").innerHTML = RANK_TABLE.map(r =>
                    `<tr class="${r.rank === rankEntry.rank ? "is-current" : ""}">
                        <td>${r.rank}（${r.threshold}）</td>
                        <td>${r.label}</td>
                        <td>${r.rank === rankEntry.rank ? "← あなた" : ""}</td>
                    </tr>`
                ).join("");

                document.querySelector("h1").style.display = "";
                switchState("playing", "result");
            }

            // ==============================
            // クリック判定
            // canvas 全体にクリックイベントを1つ登録し、
            // クリック位置がどの円の内側かをループで調べる。
            // ==============================
            canvas.addEventListener("click", (e) => {
                // getBoundingClientRect() で画面上の canvas の位置とサイズを取得する。
                const canvasRect = canvas.getBoundingClientRect();

                // CSS で canvas が縮小されていると、表示サイズと内部解像度がずれる。
                // scaleX/Y で補正することで、どの画面サイズでも判定がずれなくなる。
                const scaleX = canvas.width  / canvasRect.width;
                const scaleY = canvas.height / canvasRect.height;
                const x = (e.clientX - canvasRect.left) * scaleX;
                const y = (e.clientY - canvasRect.top)  * scaleY;

                for (let i = 0; i < circles.length; i++) {
                    const c = circles[i];
                    // 円の当たり判定: クリック座標と円の中心との距離が半径以内かを調べる。
                    // 距離 = √(dx² + dy²) だが、√の計算を省くために両辺を2乗して比較する。
                    const dx = x - c.cx;
                    const dy = y - c.cy;
                    if (dx * dx + dy * dy <= c.radius * c.radius) {
                        circles.splice(i, 1);
                        score++;
                        // 全30個クリックしたらゲームクリアとして即終了。
                        if (score >= CONFIG.MAX_TOTAL) {
                            endGame();
                            return;
                        }
                        // まだ登場できるボールが残っている場合だけ新しく出す。
                        if (totalSpawned < CONFIG.MAX_TOTAL) {
                            circles.push(createCircle());
                            totalSpawned++;
                        }
                        break;
                    }
                }
            });

            // ==============================
            // イベントリスナー
            // ボタンがクリックされたときに呼び出す関数を登録する。
            // ==============================
            // ゲーム中・結果画面のどちらからでもメニューへ戻る共通処理。
            function returnToMenu() {
                document.querySelector("h1").style.display = "";
                if (gameLoopId !== null) {
                    cancelAnimationFrame(gameLoopId);
                    gameLoopId = null;
                    switchState("playing", "menu");
                } else {
                    switchState("result", "menu");
                }
            }

            document.querySelector(".menu__start").addEventListener("click", startGame);
            document.querySelector(".result__retry").addEventListener("click", returnToMenu);
            document.querySelector(".playing__back-link").addEventListener("click", (e) => {
                e.preventDefault();
                returnToMenu();
            });

            // Esc キーでメニューへ戻る（ゲーム中・結果画面のどちらでも有効）。
            document.addEventListener("keydown", (e) => {
                if (e.key !== "Escape") return;
                const onResult = document.querySelector(".result").style.display === "block";
                if (gameLoopId !== null || onResult) {
                    returnToMenu();
                }
            });

            // ボタングループの active 切り替えと CONFIG 更新をまとめたヘルパー関数。
            // selector: 対象ボタンの CSS セレクタ、configKey: 更新する CONFIG のキー名。
            // CONFIG[configKey] はブラケット記法で、変数でキーを指定してアクセスする。
            // Python でいう config[key] と同じ。
            function setupOptionBtns(selector, configKey) {
                document.querySelectorAll(selector).forEach(btn => {
                    btn.addEventListener("click", () => {
                        document.querySelectorAll(selector).forEach(b => b.classList.remove("opt-btn--active"));
                        btn.classList.add("opt-btn--active");
                        // dataset.value は HTML の data-value 属性の値（文字列）。
                        // parseFloat を使うことで 12.5 などの小数も正確に読み取れる。
                        CONFIG[configKey] = parseFloat(btn.dataset.value);
                    });
                });
            }

            setupOptionBtns(".opt-btn--radius", "CIRCLE_RADIUS");
            setupOptionBtns(".opt-btn--count",  "CIRCLE_COUNT");
            // BALL_MOVES は boolean なので setupOptionBtns は使わず個別に処理する。
            document.querySelectorAll(".opt-btn--move").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".opt-btn--move").forEach(b => b.classList.remove("opt-btn--active"));
                    btn.classList.add("opt-btn--active");
                    CONFIG.BALL_MOVES = btn.dataset.value === "1";
                });
            });
        </script>
    </body>
</html>
